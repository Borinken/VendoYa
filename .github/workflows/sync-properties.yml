name: Sync Properties Every 5 Minutes

on:
  # Ejecutar cada 5 minutos (mínimo permitido por GitHub Actions)
  schedule:
    - cron: '*/5 * * * *'  # Cada 5 minutos
  
  # Permite ejecución manual desde GitHub UI
  workflow_dispatch:

jobs:
  sync-properties:
    name: Sync Real Estate Properties
    runs-on: ubuntu-latest
    
    steps:
      - name: Call Sync Endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.APP_URL }}/api/cron/sync-properties")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "📊 HTTP Status: $http_code"
          echo "📦 Response: $body"
          
          if [ "$http_code" != "200" ]; then
            echo "❌ Error: Sync failed with status $http_code"
            exit 1
          fi
          
          echo "✅ Sync completed successfully"
