name: Sync Properties with Real Scraping (Puppeteer)

on:
  # Ejecutar cada 5 minutos (mínimo permitido por GitHub Actions)
  schedule:
    - cron: '*/5 * * * *'  # Cada 5 minutos
  
  # Permite ejecución manual desde GitHub UI
  workflow_dispatch:

jobs:
  scrape-real:
    name: Scrape Real Properties with Puppeteer
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: ./github-scraper
        run: npm install
      
      - name: Run scraper with Puppeteer
        working-directory: ./github-scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "🚀 Iniciando scraping REAL con Puppeteer..."
          npm run scrape
          
      - name: Report status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Scraping completado exitosamente"
          else
            echo "❌ Scraping falló"
            exit 1
          fi
